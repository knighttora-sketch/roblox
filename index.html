<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBScript to Python AI Converter</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --surface: #2d2d44;
            --border: #45475a;
            --text: #cdd6f4;
            --accent: #89b4fa;
            --green: #a6e3a1;
            --red: #f38ba8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-badge {
            background: linear-gradient(90deg, var(--accent), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .btn {
            background-color: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn:hover { opacity: 0.8; }
        .btn:active { transform: scale(0.95); }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: var(--bg);
            color: var(--text);
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
        }

        .copy-btn {
            background: var(--border);
            color: var(--text);
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .copy-btn:hover { background: var(--accent); color: var(--bg); }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>🐍 VBScript to Python <span class="ai-badge">AI Converter</span></h1>
        <button class="btn" onclick="convertCode()">Convert Code ⚡</button>
    </header>

    <div class="container">
        <div class="panel">
            <div class="panel-header">
                <span>📄 VBScript Input</span>
            </div>
            <textarea id="vbsInput" placeholder="Paste your VBScript code here...
Example:
Dim name
name = InputBox(\"Enter your name:\")
If name <> \"\" Then
    MsgBox \"Hello \" & name
Else
    MsgBox \"Hello World\"
End If"></textarea>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span>🐍 Python Output</span>
                <button class="copy-btn" onclick="copyOutput()">Copy</button>
            </div>
            <textarea id="pyOutput" readonly placeholder="Python code will appear here..."></textarea>
        </div>
    </div>

    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <div>AI is translating the code...</div>
    </div>

    <footer>Local AI Engine — No data leaves your browser.</footer>

    <script>
        function convertCode() {
            const vbsCode = document.getElementById('vbsInput').value;
            const loader = document.getElementById('loader');
            
            // Show loading screen to mimic AI processing
            loader.style.display = 'flex';

            setTimeout(() => {
                const pythonCode = vbToPyAI(vbsCode);
                document.getElementById('pyOutput').value = pythonCode;
                loader.style.display = 'none';
            }, 800 + Math.random() * 1200); // Random delay between 0.8s and 2s
        }

        function vbToPyAI(vbs) {
            if (!vbs.trim()) return "";

            let lines = vbs.split('\n');
            let pyLines = [];
            let indentLevel = 0;
            const indent = () => "    ".repeat(indentLevel);

            // Regex patterns
            const dimPattern = /^\s*Dim\s+(.+)/i;
            const ifPattern = /^\s*If\s+(.+)\s+Then/i;
            const elseIfPattern = /^\s*ElseIf\s+(.+)\s+Then/i;
            const elsePattern = /^\s*Else/i;
            const endIfPattern = /^\s*End\s+If/i;
            const forPattern = /^\s*For\s+(\w+)\s*=\s*(.+)\s+To\s+(.+)(\s+Step\s+(.+))?/i;
            const forEachPattern = /^\s*For\s+Each\s+(\w+)\s+In\s+(.+)/i;
            const nextPattern = /^\s*Next/i;
            const doWhilePattern = /^\s*Do\s+While\s+(.+)/i;
            const loopPattern = /^\s*Loop/i;
            const subPattern = /^\s*Sub\s+(\w+)\s*\((.*)\)/i;
            const endSubPattern = /^\s*End\s+Sub/i;
            const funcPattern = /^\s*Function\s+(\w+)\s*\((.*)\)/i;
            const endFuncPattern = /^\s*End\s+Function/i;
            const setPattern = /^\s*Set\s+(.+)\s*=\s*(.+)/i;
            const commentPattern = /^\s*'/;
            const msgboxPattern = /^\s*MsgBox\s+(.+)/i;
            const inputboxPattern = /^\s*(\w+)\s*=\s*InputBox\((.+)\)/i;

            for (let line of lines) {
                let trimmed = line.trim();
                
                if (!trimmed) {
                    pyLines.push("");
                    continue;
                }

                // Comments
                if (commentPattern.test(trimmed)) {
                    pyLines.push(indent() + trimmed.replace("'", "#"));
                    continue;
                }

                // Variable Declarations
                if (dimPattern.test(trimmed)) {
                    // Python doesn't need Dim, but we can add type hints as comments
                    let vars = trimmed.match(dimPattern)[1].split(',').map(v => v.trim());
                    pyLines.push(indent() + `# Variables: ${vars.join(', ')}`);
                    continue;
                }

                // Set keyword (Object assignment)
                if (setPattern.test(trimmed)) {
                    let match = trimmed.match(setPattern);
                    let varName = match[1].trim();
                    let value = convertExpressions(match[2].trim());
                    pyLines.push(indent() + `${varName} = ${value}`);
                    continue;
                }

                // MsgBox
                if (msgboxPattern.test(trimmed)) {
                    let match = trimmed.match(msgboxPattern);
                    pyLines.push(indent() + `print(${convertExpressions(match[1].trim())})`);
                    continue;
                }

                // InputBox
                if (inputboxPattern.test(trimmed)) {
                    let match = trimmed.match(inputboxPattern);
                    let varName = match[1];
                    let prompt = convertExpressions(match[2].trim());
                    pyLines.push(indent() + `${varName} = input(${prompt})`);
                    continue;
                }

                // Subroutines
                if (subPattern.test(trimmed)) {
                    let match = trimmed.match(subPattern);
                    let name = match[1];
                    let args = match[2] ? match[2].split(',').map(a => a.trim()).join(', ') : '';
                    pyLines.push(`\n${indent()}def ${name}(${args}):`);
                    indentLevel++;
                    continue;
                }
                if (endSubPattern.test(trimmed)) {
                    indentLevel--;
                    pyLines.push("");
                    continue;
                }

                // Functions
                if (funcPattern.test(trimmed)) {
                    let match = trimmed.match(funcPattern);
                    let name = match[1];
                    let args = match[2] ? match[2].split(',').map(a => a.trim()).join(', ') : '';
                    pyLines.push(`\n${indent()}def ${name}(${args}):`);
                    indentLevel++;
                    continue;
                }
                if (endFuncPattern.test(trimmed)) {
                    indentLevel--;
                    pyLines.push("");
                    continue;
                }

                // If Statement
                if (ifPattern.test(trimmed)) {
                    let match = trimmed.match(ifPattern);
                    let condition = convertConditions(match[1].trim());
                    pyLines.push(indent() + `if ${condition}:`);
                    indentLevel++;
                    continue;
                }
                if (elseIfPattern.test(trimmed)) {
                    indentLevel--;
                    let match = trimmed.match(elseIfPattern);
                    let condition = convertConditions(match[1].trim());
                    pyLines.push(indent() + `elif ${condition}:`);
                    indentLevel++;
                    continue;
                }
                if (elsePattern.test(trimmed)) {
                    indentLevel--;
                    pyLines.push(indent() + `else:`);
                    indentLevel++;
                    continue;
                }
                if (endIfPattern.test(trimmed)) {
                    indentLevel--;
                    continue;
                }

                // For Loop
                if (forPattern.test(trimmed)) {
                    let match = trimmed.match(forPattern);
                    let varName = match[1];
                    let start = convertExpressions(match[2].trim());
                    let end = convertExpressions(match[3].trim());
                    let step = match[5] ? convertExpressions(match[5].trim()) : null;
                    
                    // Python range is exclusive at the end, VBS is inclusive, so add +1
                    let endExpr = `${end} + 1`;
                    
                    if (step) {
                        pyLines.push(indent() + `for ${varName} in range(${start}, ${endExpr}, ${step}):`);
                    } else {
                        pyLines.push(indent() + `for ${varName} in range(${start}, ${endExpr}):`);
                    }
                    indentLevel++;
                    continue;
                }
                if (forEachPattern.test(trimmed)) {
                    let match = trimmed.match(forEachPattern);
                    pyLines.push(indent() + `for ${match[1]} in ${match[2].trim()}:`);
                    indentLevel++;
                    continue;
                }
                if (nextPattern.test(trimmed)) {
                    indentLevel--;
                    continue;
                }

                // Do While Loop
                if (doWhilePattern.test(trimmed)) {
                    let match = trimmed.match(doWhilePattern);
                    let condition = convertConditions(match[1].trim());
                    pyLines.push(indent() + `while ${condition}:`);
                    indentLevel++;
                    continue;
                }
                if (loopPattern.test(trimmed)) {
                    indentLevel--;
                    continue;
                }

                // Standard Assignments & Expressions
                let convertedLine = convertExpressions(trimmed);
                pyLines.push(indent() + convertedLine);
            }

            return pyLines.join('\n');
        }

        // Helper to convert VB conditions to Python
        function convertConditions(cond) {
            return cond
                .replace(/=/g, '==')
                .replace(/<>/g, '!=')
                .replace(/\bAnd\b/gi, 'and')
                .replace(/\bOr\b/gi, 'or')
                .replace(/\bNot\b/gi, 'not')
                .replace(/\bTrue\b/gi, 'True')
                .replace(/\bFalse\b/gi, 'False')
                .replace(/\bMod\b/gi, '%');
        }

        // Helper to convert VB syntax to Python syntax
        function convertExpressions(expr) {
            // String concatenation
            expr = expr.replace(/&/g, '+');
            
            // VBS Constants
            expr = expr.replace(/\bvbCrLf\b/gi, '"\\n"');
            expr = expr.replace(/\bvbTab\b/gi, '"\\t"');

            // Common Functions
            expr = expr.replace(/\bLen\(([^)]+)\)/gi, 'len($1)');
            expr = expr.replace(/\bUCase\(([^)]+)\)/gi, '$1.upper()');
            expr = expr.replace(/\bLCase\(([^)]+)\)/gi, '$1.lower()');
            expr = expr.replace(/\bTrim\(([^)]+)\)/gi, '$1.strip()');
            expr = expr.replace(/\bReplace\(([^,]+),\s*([^,]+),\s*([^)]+)\)/gi, '$1.replace($2, $3)');
            expr = expr.replace(/\bInStr\(([^,]+),\s*([^)]+)\)/gi, '$1.find($2) + 1'); // VBS is 1-based
            expr = expr.replace(/\bCStr\(([^)]+)\)/gi, 'str($1)');
            expr = expr.replace(/\bCInt\(([^)]+)\)/gi, 'int($1)');
            expr = expr.replace(/\bCDbl\(([^)]+)\)/gi, 'float($1)');
            expr = expr.replace(/\bIsNumeric\(([^)]+)\)/gi, '$1.replace(".", "", 1).isdigit()';

            // Fix double equals in assignments (e.g., x = 5 == 5 -> x = 5 = 5)
            // We do a basic check: if there's only one equals and it's an assignment, revert == back to =
            if ((expr.match(/=/g) || []).length === 1 && expr.includes('==')) {
                expr = expr.replace('==', '=');
            }

            return expr;
        }

        function copyOutput() {
            const output = document.getElementById('pyOutput');
            if (!output.value) return;
            
            navigator.clipboard.writeText(output.value).then(() => {
                const btn = event.target;
                btn.textContent = "Copied!";
                setTimeout(() => btn.textContent = "Copy", 2000);
            });
        }
    </script>
</body>
</html>
